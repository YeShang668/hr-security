# ============================================
# hr-security 对外唯一入口（第 8 周）：Nginx 终止 TLS + 托管前端静态资源 + 同源反代 /api
#
# 为什么把 web 单独做成一个容器、并且 app 不再对宿主发布端口（面试点）：
#   ① 暴露面从"两个入口（前端 80 + 后端 8080）"收敛成一个（80/443 跳转 + TLS）；
#   ② 前后端同源：浏览器只看到一个域，不需要后端开 CORS，也不会出现混合内容；
#   ③ 加密与连接复用集中在一层，证书只在这一处配置和轮换。
#
# 与本项目其它部分的配套关系（别只改这里）：
#   - 应用侧 server.forward-headers-strategy=native（application.yml）：让应用知道
#     "外面是 https"，HSTS 才会下发、链接才不会生成 http；
#   - X-Forwarded-For 在本文件里是**重置**写入（$remote_addr），不是追加，
#     这样应用里 IpUtils 取最左地址拿到的就是"可信的最外层代理看到的客户端"；
#   - 应用侧的安全响应头（SecurityConfig）与这里的 add_header 有重叠，是刻意冗余：
#     直接访问后端端口（本地开发）时也有头，经 Nginx 时以本文件为准。
# ============================================

server {
    listen      80;
    listen      [::]:80;
    server_name _;

    # 80 只做跳转，不承载任何业务；也不用 302（301 让浏览器记住，避免每次明文往返）
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    # nginx 1.25+ 的写法；老版本用 "listen 443 ssl http2;"（老写法在新版只剩弃用告警）
    http2       on;
    server_name _;

    # 不对外暴露 nginx 版本号（探测工具第一件事就是看 Server 头）
    server_tokens off;

    # ---------- 证书（自签，本地演示用；生产换 Let's Encrypt，见 docs/deployment-https.md） ----------
    # 证书不进镜像，按只读卷挂载：这样换证书不用重新构建镜像，也避免私钥被烤进镜像层
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # ---------- TLS 参数 ----------
    # 只留 TLS1.2/1.3：1.0/1.1 已被 RFC 8996 弃用（BEAST/POODLE 一类的历史问题）
    ssl_protocols       TLSv1.2 TLSv1.3;
    # 只留前向保密（ECDHE）+ AEAD（GCM/CHACHA20）套件，CBC 与静态 RSA 全不要
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    # 交给客户端挑（服务端偏好会拖慢现代客户端，且 TLS1.3 的套件本就不受该开关影响）
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    # 关掉 session ticket：自签/单机场景下它只增加密钥管理的复杂度
    ssl_session_tickets off;

    # ---------- 安全响应头 ----------
    # HSTS：一年内强制 https（含子域）。**只有确认全站 https 可用后再加**，
    # 否则会把用户锁在打不开的 https 上；preload 一律不上（不可撤销）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "no-referrer" always;
    # 前端 SPA 的 CSP：脚本只允许自身文件（Vite 产物无内联脚本）；
    # style 需要 'unsafe-inline'（Element Plus 运行时注入样式）；connect-src 'self' 覆盖同源 /api
    add_header Content-Security-Policy   "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self' data:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;

    root  /usr/share/nginx/html;
    index index.html;

    # ---------- 前端 SPA ----------
    # 注意：这里**没有**单独给 /assets/ 加 Cache-Control —— nginx 的 add_header
    # 在 location 里一旦出现就不再继承 server 级配置，很容易悄悄丢掉上面的安全头。
    # 静态资源缓存属于优化项，本周先保证"安全头统一在场"（取舍见 docs/deployment-https.md）。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- 后端 API 同源反代 ----------
    location /api/ {
        proxy_pass         http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        # 重置而非追加：只信任本层写入的地址，客户端自带的 XFF 一律丢弃（防伪造来源）
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        # 密钥轮换的批量重加密可能跑几十秒，给足超时（否则前端看到 504 而实际后台成功）
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
