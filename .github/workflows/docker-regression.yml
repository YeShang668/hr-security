# ============================================
# 容器回归（GitHub Actions 版）——不依赖本机虚拟化能力
#
# 为什么需要它：
#   本机是 Windows 11 家庭版，Docker Desktop 需要 WSL2 / Hyper-V 才能跑，
#   而"本机 Windows 虚拟化功能层未启用"时 Docker Desktop 起不来（HypervisorPresent=False）。
#   GitHub 的 ubuntu runner 原生带 Docker + Compose v2，因此把"容器一键部署 + 全量回归"
#   放到 CI 里跑：既拿到真实容器环境的回归证据，也不需要动本机 BIOS / Windows 功能 / 重启。
#
# 跑什么：test-payloads/docker-e2e-test.sh（自动 docker compose up -d --build →
#         等应用就绪 → 注册 zhangsan → 刷新 token → 跑满 176 用例：20+11+25+40+50+30）
# 触发：手动（workflow_dispatch）或 push 改动到相关路径
#
# 步骤刻意拆成"构建 / 启动+等就绪 / 回归"三段（第 7 周踩坑后调整）：
#   合成一段时，"镜像构建失败"和"测试有失败用例"都只表现为"某一步 exit 1"，
#   必须登录下载完整日志才能分辨（而 GitHub 上日志查看需要登录）。
#   拆开后，失败的步骤名本身就是诊断结论：构建失败 → 第 1 段红；起不来 → 第 2 段红；
#   用例失败 → 第 3 段红（此时 Step Summary 里能看到各脚本 PASS/FAIL）。
# ============================================
name: docker-regression

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'sql/**'
      - 'docker-build/**'
      - 'docker-compose.yml'
      - 'Dockerfile'
      - 'pom.xml'
      - 'test-payloads/**'
      - '.github/workflows/docker-regression.yml'

jobs:
  docker-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 环境自检（docker / compose / python）
        run: |
          docker version
          docker compose version
          python3 --version
          bash --version | head -1

      - name: 构建镜像（构建日志单独可见）
        run: docker compose build

      - name: 启动容器并等待应用就绪
        run: |
          docker compose up -d
          # 与 docker-e2e-test.sh 里的就绪判断保持一致：能登录即视为就绪（首次 MySQL 初始化 30~60s）
          for i in $(seq 1 90); do
            CODE=$(curl -s -m 3 -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/api/auth/login \
                   -H 'Content-Type: application/json' \
                   --data-binary @test-payloads/login-admin.json 2>/dev/null || true)
            if [ "$CODE" = "200" ]; then echo "应用已就绪（第 ${i} 次探测）"; exit 0; fi
            sleep 2
          done
          echo "应用 180s 内未就绪"; docker compose ps; docker compose logs --tail=200 app; exit 1

      - name: 全量回归（176 用例）
        env:
          PYTHON: python3
        run: |
          # 刻意不用 set -e / pipefail 直接中断：先把结果写进 Step Summary 再决定退出码。
          # 原因（第 7 周踩坑）：GitHub 的日志查看需要登录，匿名 API 取日志是 403；
          # 而 Step Summary 是公开可见的，所以"失败用例清单 + 日志尾部"必须写进 Summary，
          # 否则在没登录的环境里根本看不出是哪条用例失败、为什么失败。
          set +e
          bash test-payloads/docker-e2e-test.sh 2>&1 | tee /tmp/docker-e2e.log
          EXIT=${PIPESTATUS[0]}
          {
            echo '## 容器环境全量回归结果'
            echo ''
            echo '```'
            grep -aE '结果：PASS|Docker 环境回归结果' /tmp/docker-e2e.log || true
            echo '```'
            if [ "$EXIT" != "0" ]; then
              echo '## 失败用例（FAIL 行）'
              echo ''
              echo '```'
              grep -a '^FAIL' /tmp/docker-e2e.log || echo '(没有 FAIL 行：可能是脚本提前异常退出，见下方日志尾部)'
              echo '```'
              echo '## 日志尾部 100 行'
              echo ''
              echo '```'
              tail -100 /tmp/docker-e2e.log || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit $EXIT

      - name: 失败时导出容器与数据库日志
        if: failure()
        run: |
          docker compose ps -a || true
          docker compose logs --tail=200 app || true
          docker compose logs --tail=100 mysql || true
          docker compose logs --tail=50 redis || true

      - name: 成功时写容器状态摘要
        if: success()
        run: |
          {
            echo '## 容器状态'
            echo ''
            echo '```'
            docker compose ps
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
