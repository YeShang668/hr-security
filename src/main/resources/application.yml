server:
  port: 8080

spring:
  application:
    name: hr-security
  # 加载运行目录下未提交的 application-local.yml（本地开发密钥/覆盖用，不入 git）。
  # 容器/生产一律用环境变量注入，不依赖该文件（optional = 文件不存在不影响启动）。
  config:
    import: optional:file:./application-local.yml
  datasource:
    # 第 4 周起全部环境变量化：本地不配变量时走默认值（localhost root 空密码）；
    # Docker 里由 docker-compose 注入 MYSQL_HOST=mysql 等服务名，应用不硬编码 localhost。
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/hr_security?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  data:
    redis:
      # Docker 里 REDIS_HOST=redis（compose 服务名即 DNS）
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 开发/演示期打印 SQL，上线前改为 noop 关闭
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false

jwt:
  # token 有效期（小时），Redis 会话 TTL 与其同步（见 JwtUtil）
  expire-hours: 24
  # 密钥不入主配置：环境变量 JWT_SECRET 优先（JwtUtil 内校验），其次本地 application-local.yml；
  # 两处都缺失时启动直接报错提示，避免用弱密钥静默运行

crypto:
  # 敏感字段 AES-256-GCM 加密（第 6 周）。
  # 主密钥同样**不入主配置**：环境变量 AES_MASTER_KEY 优先，其次本地 application-local.yml 的
  # crypto.master-key；两处都缺 → 启动失败（EnvKeyProvider 内 fail fast）。
  # 生成方式：openssl rand -base64 32
  #
  # keyId 是密钥版本号，会写进密文 v1:{keyId}:{iv}:{ct}；
  # 第 7 周做 KEK/DEK 与密钥轮换时，新数据用新 keyId 加密、老密文按老 keyId 取老密钥解密。
  key-id: ${AES_KEY_ID:k1}
  # 身份证检索哈希盐：留空则由 AES 主密钥域分隔派生（不必额外管一个密钥）
  # hash-salt: ${ID_HASH_SALT:}
