server:
  port: 8080
  # 第 8 周（HTTPS 部署）：应用跑在 Nginx 反代后面时，容器里看到的协议永远是 http、
  # 对端地址也是网关地址。native = 交给 Servlet 容器（Tomcat RemoteIpValve）依据
  # X-Forwarded-Proto / X-Forwarded-For 还原真实协议与客户端地址，于是：
  #   ① request.isSecure() 变 true → HSTS 响应头才会被写入（见 SecurityConfig）；
  #   ② 后续要用 request.getScheme() 生成链接时不会生成 http 链接。
  # 为什么用 native 而不是 framework：framework（ForwardedHeaderFilter）会把 X-Forwarded-*
  # 头**从请求里摘掉**避免重复处理，而本项目的 IpUtils 需要直接读该头解析代理链；
  # native 只改写 remoteAddr/scheme，不动请求头，两者可以共存（测试 S4/A8 覆盖）。
  forward-headers-strategy: native

spring:
  application:
    name: hr-security
  # 加载运行目录下未提交的 application-local.yml（本地开发密钥/覆盖用，不入 git）。
  # 容器/生产一律用环境变量注入，不依赖该文件（optional = 文件不存在不影响启动）。
  config:
    import: optional:file:./application-local.yml
  datasource:
    # 第 4 周起全部环境变量化：本地不配变量时走默认值（localhost root 空密码）；
    # Docker 里由 docker-compose 注入 MYSQL_HOST=mysql 等服务名，应用不硬编码 localhost。
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/hr_security?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  data:
    redis:
      # Docker 里 REDIS_HOST=redis（compose 服务名即 DNS）
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 开发/演示期打印 SQL，上线前改为 noop 关闭
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false

# 第 8 周：登录失败限流（防爆破/撞库），计数存 Redis（多实例共享 + 重启不清零）。
# 阈值差异是刻意的：账号维度更严（保护单个账号），IP 维度更宽
# （避免"故意输错把别人账号锁死"的拒绝服务反噬，理由见 LoginAttemptService 类注释）。
security:
  login:
    max-attempts-per-user: 5
    max-attempts-per-ip: 20
    lock-minutes: 10

jwt:
  # token 有效期（小时），Redis 会话 TTL 与其同步（见 JwtUtil）
  expire-hours: 24
  # 密钥不入主配置：环境变量 JWT_SECRET 优先（JwtUtil 内校验），其次本地 application-local.yml；
  # 两处都缺失时启动直接报错提示，避免用弱密钥静默运行

crypto:
  # 敏感字段 AES-256-GCM 加密（第 6 周）+ KEK/DEK 两级密钥与轮换（第 7 周）。
  #
  # KEK（密钥加密密钥）**不入主配置**：环境变量 AES_MASTER_KEY 优先，其次本地 application-local.yml 的
  # crypto.master-key；两处都缺 → 启动失败（EnvKeyProvider 内 fail fast）。生成：openssl rand -base64 32
  # 语义：KEK 只用于"信封加密 DEK"（sys_data_key.encrypted_dek），不直接加密业务字段。
  kek-id: ${AES_KEK_ID:kek1}
  #
  # key-id：**首次引导**（sys_data_key 为空）时生成的 DEK 版本号，会写进密文 v1:{keyId}:{iv}:{ct}。
  # 之后新数据用哪把密钥加密，由 sys_data_key 里 status=ACTIVE 的那把决定（轮换后是 k2、k3…），
  # 不再看这个配置——它只是"新环境第一把密钥"的名字。轮换流程见 docs/key-management.md。
  key-id: ${AES_KEY_ID:k1}
  # 身份证检索哈希盐：留空则由 KEK 域分隔派生（不必额外管一个密钥）。
  # 注意：哈希只与 KEK 绑定，轮换 DEK 不会让 id_card_hash 失效。
  # hash-salt: ${ID_HASH_SALT:}
